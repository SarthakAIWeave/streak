name: permission_handler_windows
description: Empty Windows side of permission_handler, so Streak never registers for location updates.
version: 0.2.1
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        dartPluginClass: PermissionHandlerWindows
